name: Build APK

# ساخت خودکار APK روی سرورهای گیت‌هاب (بدون نیاز به Android Studio روی کامپیوتر شما)
# اجرا: تب Actions → Build APK → Run workflow
# خروجی: پایین همان اجرا → بخش Artifacts → hazine-daftar-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # روی ماشین‌های گیت‌هاب، Android SDK از قبل نصب است؛ فقط مسیر را ست می‌کنیم
      # و اگر پلتفرم ۳۴ نبود، نصبش می‌کنیم (بدون اکشن خارجی، چون گاهی خطا می‌دهد).
      - name: آماده‌سازی Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK=$SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ] && [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$SDK/platforms" || true

      - name: کش Gradle (سرعت بیلدهای بعدی)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # کلید امضای debug را بین اجراها نگه می‌داریم تا نسخهٔ جدید روی نسخهٔ قبلی
      # نصب شود (وگرنه امضا هر بار عوض می‌شود و باید اپ حذف شود = پاک شدن داده).
      - name: کش کلید امضای debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: اجرایی کردن gradlew
        run: chmod +x ./gradlew

      - name: تست‌های واحد
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: ساخت APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: آپلود APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hazine-daftar-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: آپلود گزارش تست‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            test.log
          if-no-files-found: ignore
          retention-days: 14

      # در صورت خطا، خلاصهٔ خطاها را در ایشو شمارهٔ ۵ می‌نویسیم تا قابل خواندن باشد
      # (لاگ خام Actions از این محیط در دسترس نیست و این راه، جایگزین آن است).
      - name: ثبت خطا برای بررسی
        if: failure() || steps.tests.outcome == 'failure' || steps.apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### گزارش بیلد — اجرا ${GITHUB_RUN_ID}"
            echo ""
            echo "#### خطاهای کامپایل کاتلین (\`e:\`)"
            echo '```'
            grep -E '^e: ' build.log test.log 2>/dev/null | head -80 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### خطاهای Gradle / Android (\`error:\`)"
            echo '```'
            grep -E 'error:|Error:|Could not|Unresolved|Caused by' build.log 2>/dev/null | head -40 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### بخش «What went wrong»"
            echo '```'
            grep -A 25 -E 'What went wrong|FAILURE: Build failed' build.log 2>/dev/null | head -70 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### نتیجهٔ تست‌ها"
            echo '```'
            grep -E '^e: |tests? completed|FAILED' test.log 2>/dev/null | head -40 || echo "(هیچ)"
            echo '```'
          } > error-report.md
          wc -c error-report.md
          gh issue comment 5 --body-file error-report.md || true
