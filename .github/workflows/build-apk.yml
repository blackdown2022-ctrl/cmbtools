name: ساخت APK تیزنت

# ساخت خودکار APK روی سرورهای گیت‌هاب (بدون نیاز به Android Studio روی کامپیوتر شما)
# اجرا: تب Actions → Build APK → Run workflow
# خروجی: پایین همان اجرا → بخش Artifacts → hazine-daftar-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: خواندن شمارهٔ نسخه
        id: ver
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=${NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-0}" >> "$GITHUB_OUTPUT"
          echo "نسخه: ${NAME} (کد ${CODE})"

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # روی ماشین‌های گیت‌هاب، Android SDK از قبل نصب است؛ فقط مسیر را ست می‌کنیم
      # و اگر پلتفرم ۳۴ نبود، نصبش می‌کنیم (بدون اکشن خارجی، چون گاهی خطا می‌دهد).
      - name: آماده‌سازی Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK=$SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ] && [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$SDK/platforms" || true

      - name: کش Gradle (سرعت بیلدهای بعدی)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-v2-${{ runner.os }}-

      # گواهی انتشار مستقل از کلید debug و فقط از کش شاخهٔ main بازیابی می‌شود.
      - name: بازیابی کلید ثابت امضای انتشار
        id: release-keystore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cmbtools-release.p12
          key: cmbtools-release-keystore-v1

      - name: آماده‌سازی کلید ثابت امضای انتشار
        env:
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          RELEASE_STORE_PASSWORD: cmbtools-release-2026-stable
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/cmbtools-release.p12"
          if [ ! -s "$KEYSTORE" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$APP_VERSION_CODE" -gt 31 ]; then
              echo "e: کلید ثابت امضا پیدا نشد؛ انتشار متوقف شد تا APK با کلید تازه منتشر نشود"
              exit 1
            fi
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype PKCS12 \
              -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_STORE_PASSWORD" \
              -alias cmbtools-release -keyalg RSA -keysize 3072 -validity 36500 \
              -dname "CN=CMBTools Android Release,O=CMBTools"
          fi
          {
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=cmbtools-release"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: ذخیره کلید ثابت امضای انتشار
        if: steps.release-keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cmbtools-release.p12
          key: cmbtools-release-keystore-v1

      - name: اجرایی کردن gradlew
        run: chmod +x ./gradlew

      - name: بررسی دسترسی مخازن
        run: |
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$1" 2>/dev/null || echo ERR)
            echo "- $code  $1"
          }
          {
            echo "### دسترسی مخازن از رانر"
            check "https://maven.aliyun.com/repository/google/com/android/application/com.android.application.gradle.plugin/8.5.2/com.android.application.gradle.plugin-8.5.2.pom"
            check "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.20-1.0.25/com.google.devtools.ksp.gradle.plugin-2.0.20-1.0.25.pom"
            check "https://repo.huaweicloud.com/repository/maven/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.20-1.0.25/com.google.devtools.ksp.gradle.plugin-2.0.20-1.0.25.pom"
            check "https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.20-1.0.25/com.google.devtools.ksp.gradle.plugin-2.0.20-1.0.25.pom"
            check "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.20-1.0.25/com.google.devtools.ksp.gradle.plugin-2.0.20-1.0.25.pom"
          } | tee net.txt

      # اگر تستی شکست بخورد، بیلد متوقف می‌شود تا نسخهٔ ناسالم منتشر نشود.
      - name: تست‌های واحد
        id: tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: ساخت APK
        id: apk
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: بررسی ثبات گواهی امضای APK
        env:
          RELEASE_STORE_PASSWORD: cmbtools-release-2026-stable
          RELEASE_KEY_ALIAS: cmbtools-release
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          KEYSTORE="$RUNNER_TEMP/cmbtools-release.p12"
          expected=$(keytool -exportcert -alias "$RELEASE_KEY_ALIAS" -keystore "$KEYSTORE" \
            -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" | sha256sum | awk '{print $1}')
          actual=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort | paste -sd ',' -)
          echo "گواهی مورد انتظار: $expected"
          echo "گواهی APK ساخته‌شده: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "e: APK با کلید ثابت انتشار امضا نشده است" | tee -a build.log
            exit 1
          fi
          echo "گواهی APK با کلید پایدار انتشار یکسان است."

      - name: بررسی ایمنی برنامه (Lint)
        id: lint
        run: |
          set -o pipefail
          ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: بررسی امضا و نصب‌پذیری APK
        id: verify
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          test -s "$APK"
          "$SDK/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package: name='ir.cmbtools.ledger'|^sdkVersion:|^targetSdkVersion:"
          if echo "$BADGING" | grep -q '^application-debuggable'; then
            echo "Refusing to publish a debuggable APK" >&2
            exit 1
          fi

      - name: آپلود APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tiznet-apk-${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: خلاصهٔ تست‌ها
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### نتیجهٔ تست‌های واحد — اجرا ${GITHUB_RUN_ID}"
            echo '```'
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              grep -hoE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' \
                app/build/test-results/testDebugUnitTest/*.xml | head -30
              total=$(grep -hoE 'tests="[0-9]+"' app/build/test-results/testDebugUnitTest/*.xml \
                | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
              echo "مجموع تست‌های اجراشده: $total"
              grep -h -B 2 -A 6 '<failure\|<error' app/build/test-results/testDebugUnitTest/*.xml | head -60 || true
            else
              echo "گزارش تست پیدا نشد"
              total=0
            fi
            echo '```'
          } > tests.md
          cat tests.md
          # در صورت شکست تست یا نبود هیچ تستی، گزارش در ایشو ۵ ثبت می‌شود
          if grep -ql '<failure\|<error' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null \
             || [ "${total:-0}" -lt 15 ]; then
            gh issue comment 5 --body-file tests.md || true
          fi

      - name: انتشار APK در Releases (لینک دانلود ساده)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "tiznet-${VERSION}.apk"
          if [ "$CODE" -eq 31 ]; then
            NOTES="نسخهٔ انتقال به امضای پایدار APK. برای نصب این نسخه، یک‌بار برنامهٔ قبلی را حذف کنید؛ سپس APK را نصب و بکاپ را بازیابی کنید. نسخه‌های بعدی روی همین نسخه نصب می‌شوند."
          else
            NOTES="نسخهٔ ${VERSION} با امضای پایدار؛ روی نسخهٔ قبلی نصب می‌شود و داده‌ها حفظ می‌شوند. برای احتیاط قبل از به‌روزرسانی از گزارش‌ها → پشتیبان کامل یک فایل JSON بگیرید."
          fi
          gh release create "v${VERSION}-${GITHUB_RUN_NUMBER}" \
            "tiznet-${VERSION}.apk" \
            --title "تیزنت نسخهٔ ${VERSION} (کد ${CODE} — ساخت ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" \
            --latest || true

      - name: آپلود گزارش تست‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            test.log
            build.log
            lint.log
          if-no-files-found: ignore
          retention-days: 14

      # در صورت خطا، خلاصهٔ خطاها را در ایشو شمارهٔ ۵ می‌نویسیم تا قابل خواندن باشد
      # (لاگ خام Actions از این محیط در دسترس نیست و این راه، جایگزین آن است).
      - name: ثبت خطا برای بررسی
        if: failure() || steps.tests.outcome == 'failure' || steps.apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### گزارش بیلد — اجرا ${GITHUB_RUN_ID}"
            echo ""
            echo "#### خطاهای کامپایل کاتلین (\`e:\`)"
            echo '```'
            grep -E '^e: ' build.log test.log 2>/dev/null | head -80 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### خطاهای Gradle / Android / Lint"
            echo '```'
            grep -Ei 'error:|Error:|Could not|Unresolved|Caused by|fatal|^.*\berror\b' build.log lint.log 2>/dev/null | head -60 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### بخش «What went wrong»"
            echo '```'
            grep -A 25 -E 'What went wrong|FAILURE: Build failed' build.log lint.log 2>/dev/null | head -90 || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### دسترسی مخازن"
            echo '```'
            cat net.txt 2>/dev/null || echo "(هیچ)"
            echo '```'
            echo ""
            echo "#### نتیجهٔ تست‌ها"
            echo '```'
            grep -E '^e: |tests? completed|FAILED' test.log 2>/dev/null | head -40 || echo "(هیچ)"
            echo '```'
          } > error-report.md
          wc -c error-report.md
          gh issue comment 5 --body-file error-report.md || true
